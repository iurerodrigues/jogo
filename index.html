<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Monstros de Bolso</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* ================= TEMA (cores nativas do Telegram + reserva) ================= */
  :root {
    --fb-bg: #f4f1ea;
    --fb-text: #1d1b18;
    --fb-hint: #8a857c;
    --fb-btn: #e2483d;
    --fb-btn-text: #ffffff;
    --fb-card: #ffffff;

    --bg: var(--tg-theme-bg-color, var(--fb-bg));
    --text: var(--tg-theme-text-color, var(--fb-text));
    --hint: var(--tg-theme-hint-color, var(--fb-hint));
    --btn: var(--tg-theme-button-color, var(--fb-btn));
    --btn-text: var(--tg-theme-button-text-color, var(--fb-btn-text));
    --card: var(--tg-theme-secondary-bg-color, var(--fb-card));

    --hp-verde: #3cb371;
    --hp-amarelo: #f0b429;
    --hp-vermelho: #e5484d;
    --xp-azul: #4a9df0;
    --ouro: #e8b520;
    --sombrio: #7b5bd6;
    --log-bg: #15171c;
    --log-text: #e9f5e1;
    --sombra: 0 2px 10px rgba(0, 0, 0, .08);
    --raio: 12px;
    --barra-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fb-bg: #17181c;
      --fb-text: #f1efe9;
      --fb-hint: #8e8c87;
      --fb-card: #22242a;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Nunito", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    overscroll-behavior: none;
    user-select: none;
  }

  /* ================= ESTRUTURA ================= */
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px calc(var(--barra-h) + 24px + env(safe-area-inset-bottom));
    min-height: 100%;
  }
  .tela { display: none; flex-direction: column; gap: 14px; animation: entrar .22s ease; }
  .tela.ativa { display: flex; }
  @keyframes entrar { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--card);
    border-radius: var(--raio);
    box-shadow: var(--sombra);
    padding: 14px;
  }
  .pixel { font-family: "Press Start 2P", monospace; letter-spacing: .5px; }
  .titulo-secao { font-size: 11px; color: var(--hint); text-transform: uppercase; margin: 6px 2px 0; }
  .linha-titulo { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .linha-titulo .titulo-secao { margin: 0 2px; }

  /* ================= BOTÕES ================= */
  button {
    font: inherit;
    color: inherit;
    border: none;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease, opacity .12s ease;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: .45; pointer-events: none; }

  .btn-principal {
    background: var(--btn);
    color: var(--btn-text);
    border-radius: var(--raio);
    box-shadow: var(--sombra);
    font-weight: 800;
  }
  .btn-secundario {
    background: var(--card); border-radius: var(--raio); box-shadow: var(--sombra); font-weight: 800;
  }

  .chip {
    font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
    background: color-mix(in srgb, var(--text) 8%, transparent);
    white-space: nowrap;
  }
  .tag {
    font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px;
    color: #fff; vertical-align: middle; white-space: nowrap;
  }
  .tag-brilhante { background: linear-gradient(90deg, #e8b520, #f5d76e); color: #3a2b00; }
  .tag-sombrio { background: var(--sombrio); }

  /* ================= TELA INICIAL ================= */
  .boas-vindas { text-align: center; padding: 22px 16px; }
  .boas-vindas h1 { font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
  .boas-vindas p { color: var(--hint); line-height: 1.5; }
  .iniciais { display: flex; flex-direction: column; gap: 10px; }
  .inicial {
    display: flex; align-items: center; gap: 14px; text-align: left;
    padding: 12px 16px; border-left: 6px solid var(--cor-tipo);
  }
  .inicial svg { width: 72px; height: 72px; flex-shrink: 0; }
  .inicial .nome { font-weight: 800; font-size: 18px; display: block; }
  .inicial .desc { font-size: 12px; color: var(--hint); display: block; margin-top: 2px; }

  /* ================= ABA 1: EXPLORAÇÃO ================= */
  .treinador { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--btn); color: var(--btn-text);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .treinador-info { flex: 1; min-width: 0; }
  .treinador-nome { font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .treinador-stats { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

  .lider { display: flex; align-items: center; gap: 14px; }
  .lider-sprite {
    width: 96px; height: 96px; flex-shrink: 0;
    border-radius: var(--raio);
    background: color-mix(in srgb, var(--btn) 10%, transparent);
    display: flex; align-items: center; justify-content: center;
  }
  .lider-sprite svg { width: 84px; height: 84px; animation: respirar 2.4s ease-in-out infinite; }
  .lider-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .lider-rotulo { font-size: 9px; color: var(--hint); }
  .lider-nome { font-weight: 800; font-size: 18px; }
  .linha-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .rotas { display: flex; flex-direction: column; gap: 10px; }
  .rota {
    width: 100%;
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px;
    border-radius: var(--raio);
    background: var(--card);
    box-shadow: var(--sombra);
    text-align: left;
    border-left: 6px solid var(--cor-rota);
  }
  .rota-icone { font-size: 26px; }
  .rota-texto { flex: 1; }
  .rota-nome { font-weight: 800; font-size: 17px; display: block; }
  .rota-desc { font-size: 12px; color: var(--hint); margin-top: 2px; display: block; }
  .rota-seta { color: var(--hint); font-size: 20px; }
  .rota.buscando .rota-seta { animation: girar .6s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* ================= BARRAS ================= */
  .hp-linha { display: flex; align-items: center; gap: 8px; }
  .hp-rotulo { font-size: 9px; font-weight: 800; color: var(--hint); min-width: 18px; }
  .hp-barra {
    flex: 1; height: 10px; border-radius: 999px;
    background: color-mix(in srgb, var(--text) 12%, transparent);
    overflow: hidden;
  }
  .hp-barra.fina { height: 5px; }
  .hp-preenchimento {
    height: 100%; width: 100%; border-radius: 999px;
    background: var(--hp-verde);
    transition: width .45s ease, background-color .45s ease;
  }
  .xp-preenchimento { background: var(--xp-azul); }
  .hp-num { font-size: 12px; font-weight: 800; min-width: 62px; text-align: right; font-variant-numeric: tabular-nums; }

  /* ================= ABA 2: BATALHA ================= */
  .inimigo-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .inimigo-nome { font-weight: 800; font-size: 18px; margin-right: 4px; }

  .arena {
    position: relative;
    height: 190px;
    display: flex; align-items: flex-end; justify-content: center;
    border-radius: var(--raio);
    background: linear-gradient(to bottom, transparent 55%, color-mix(in srgb, var(--cor-arena, #3cb371) 18%, transparent) 55%);
  }
  .arena::after {
    content: ""; position: absolute; bottom: 14px; left: 50%;
    width: 150px; height: 22px; transform: translateX(-50%);
    border-radius: 50%;
    background: color-mix(in srgb, var(--text) 12%, transparent);
  }
  .arena svg { width: 160px; height: 160px; position: relative; z-index: 1; animation: respirar 2s ease-in-out infinite; }
  @keyframes respirar { 50% { transform: translateY(-4px) scaleY(1.02); } }
  .arena.dano svg { animation: tremer .35s ease; }
  @keyframes tremer { 20%, 60% { transform: translateX(-8px); filter: brightness(1.8); } 40%, 80% { transform: translateX(8px); } }
  .arena.capturando svg { animation: encolher .5s ease forwards; }
  @keyframes encolher { to { transform: scale(0); opacity: 0; } }
  .arena.escapou svg { animation: voltar .4s ease; }
  @keyframes voltar { from { transform: scale(0); opacity: 0; } }
  .arena.raro::before {
    content: "✨"; position: absolute; top: 18px; right: 22%; font-size: 26px; z-index: 2;
    animation: brilhar 1.2s ease-in-out infinite;
  }
  @keyframes brilhar { 50% { opacity: .2; transform: scale(.7) rotate(20deg); } }

  .lider-batalha { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  .lider-batalha svg { width: 44px; height: 44px; flex-shrink: 0; }
  .lider-batalha .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .lider-batalha .nome { font-weight: 800; font-size: 14px; }

  .log {
    background: var(--log-bg);
    color: var(--log-text);
    border-radius: var(--raio);
    padding: 12px 14px;
    height: 96px;
    overflow-y: auto;
    font-size: 10px;
    line-height: 1.7;
    box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .06);
  }
  .log p { opacity: .55; }
  .log p:last-child { opacity: 1; }
  .log p:last-child::before { content: "▶ "; color: #ffd166; }

  .ataques { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ataque {
    padding: 12px 10px;
    border-radius: var(--raio);
    background: var(--card);
    box-shadow: var(--sombra);
    border-bottom: 4px solid var(--cor-tipo);
    display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
    text-align: left;
  }
  .ataque-nome { font-weight: 800; font-size: 15px; }
  .ataque-info { font-size: 11px; color: var(--hint); }

  .utilitarios { display: flex; gap: 10px; }
  .utilitarios button { flex: 1; padding: 14px 6px; font-size: 14px; }

  /* ================= EQUIPE / BOX ================= */
  .lista { display: flex; flex-direction: column; gap: 10px; }
  .monstro-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
  .monstro-item svg { width: 56px; height: 56px; flex-shrink: 0; }
  .monstro-item .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .monstro-item .nome { font-weight: 800; }
  .monstro-item .lider-chip { color: var(--btn); }
  .grade-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .box-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; }
  .box-item svg { width: 60px; height: 60px; }
  .box-item .nome { font-weight: 800; font-size: 13px; text-align: center; }
  .box-item .lv { font-size: 11px; color: var(--hint); }
  .vazio { text-align: center; color: var(--hint); padding: 28px 12px; line-height: 1.5; }
  .btn-cura { width: 100%; padding: 14px; font-size: 15px; }

  /* ================= LOJA ================= */
  .item-loja { display: flex; align-items: center; gap: 12px; }
  .item-icone {
    width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 24px;
    background: color-mix(in srgb, var(--text) 6%, transparent);
  }
  .item-loja .info { flex: 1; min-width: 0; }
  .item-loja .nome { font-weight: 800; display: block; }
  .item-loja .desc { font-size: 12px; color: var(--hint); display: block; margin-top: 2px; }
  .item-loja .tem { font-size: 11px; font-weight: 800; color: var(--hint); display: block; margin-top: 4px; }
  .btn-comprar { padding: 10px 12px; font-size: 13px; white-space: nowrap; }

  /* ================= MENU (folha inferior) ================= */
  .menu-fundo {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 30;
    display: flex; align-items: flex-end; justify-content: center;
    animation: aparecer .15s ease;
  }
  @keyframes aparecer { from { opacity: 0; } }
  .menu-folha {
    width: 100%; max-width: 480px;
    background: var(--bg);
    border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
    animation: subir .2s ease;
  }
  @keyframes subir { from { transform: translateY(40px); } }
  .menu-titulo { font-weight: 800; font-size: 16px; text-align: center; margin-bottom: 4px; }
  .menu-sub { font-size: 13px; color: var(--hint); text-align: center; margin-top: -6px; margin-bottom: 4px; }
  .menu-folha button { width: 100%; padding: 14px; font-size: 15px; }
  .menu-folha .perigo { color: var(--hp-vermelho); }

  /* ================= BARRA INFERIOR FIXA ================= */
  .barra-inferior {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: calc(var(--barra-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--card);
    box-shadow: 0 -2px 12px rgba(0, 0, 0, .08);
    display: flex; justify-content: center;
    z-index: 10;
  }
  .barra-inferior.oculta { display: none; }
  .barra-inferior .interno { display: flex; width: 100%; max-width: 480px; }
  .aba {
    flex: 1; background: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: var(--hint); font-size: 11px; font-weight: 800;
  }
  .aba .icone { font-size: 22px; filter: grayscale(1); opacity: .7; transition: filter .15s, opacity .15s, transform .15s; }
  .aba.ativa { color: var(--btn); }
  .aba.ativa .icone { filter: none; opacity: 1; transform: translateY(-2px); }

  /* ================= AVISO (toast) ================= */
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--barra-h) + 16px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px); opacity: 0;
    background: var(--log-bg); color: var(--log-text);
    padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
    transition: opacity .2s, transform .2s; pointer-events: none; z-index: 40;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.visivel { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<main id="app">

  <!-- ===================== ESCOLHA INICIAL ===================== -->
  <section id="tela-inicio" class="tela">
    <div class="card boas-vindas">
      <h1 class="pixel">Monstros de Bolso</h1>
      <p>Bem-vindo, <b id="inicio-nome">Treinador</b>!<br>Escolha seu primeiro parceiro de aventura.</p>
    </div>
    <div class="iniciais" id="iniciais"></div>
  </section>

  <!-- ===================== ABA 1: EXPLORAÇÃO ===================== -->
  <section id="tela-explorar" class="tela">
    <div class="card treinador">
      <div class="avatar pixel" id="treinador-avatar">?</div>
      <div class="treinador-info">
        <div class="treinador-nome" id="treinador-nome">Treinador</div>
        <div class="treinador-stats">
          <span class="chip">⭐ Lv <span id="treinador-level">1</span></span>
          <span class="chip">💰 <span id="treinador-dinheiro">0</span></span>
          <span class="chip">🔴 <span id="treinador-esferas">0</span></span>
        </div>
      </div>
    </div>

    <div class="card lider">
      <div class="lider-sprite" id="lider-sprite"></div>
      <div class="lider-info">
        <span class="lider-rotulo pixel">LÍDER</span>
        <span class="lider-nome" id="lider-nome">—</span>
        <div class="linha-chips" id="lider-chips"></div>
        <div class="hp-linha">
          <span class="hp-rotulo pixel">HP</span>
          <div class="hp-barra"><div class="hp-preenchimento" id="lider-hp-barra"></div></div>
          <span class="hp-num" id="lider-hp-num">0/0</span>
        </div>
        <div class="hp-linha">
          <span class="hp-rotulo pixel">XP</span>
          <div class="hp-barra fina"><div class="hp-preenchimento xp-preenchimento" id="lider-xp-barra"></div></div>
        </div>
      </div>
    </div>

    <h2 class="titulo-secao pixel">Rotas de Exploração</h2>
    <div class="rotas">
      <button class="rota" style="--cor-rota:#3cb371" onclick="procurarMonstro('mato', this)">
        <span class="rota-icone">🌿</span>
        <span class="rota-texto"><span class="rota-nome">Mato</span><span class="rota-desc">Planta e Normal · raro: Fogo</span></span>
        <span class="rota-seta">›</span>
      </button>
      <button class="rota" style="--cor-rota:#a0785a" onclick="procurarMonstro('caverna', this)">
        <span class="rota-icone">⛰️</span>
        <span class="rota-texto"><span class="rota-nome">Caverna</span><span class="rota-desc">Rocha · raro: Elétrico</span></span>
        <span class="rota-seta">›</span>
      </button>
      <button class="rota" style="--cor-rota:#3a8ee6" onclick="procurarMonstro('agua', this)">
        <span class="rota-icone">💧</span>
        <span class="rota-texto"><span class="rota-nome">Água</span><span class="rota-desc">Água · raro: Elétrico</span></span>
        <span class="rota-seta">›</span>
      </button>
    </div>
  </section>

  <!-- ===================== ABA 2: BATALHA ===================== -->
  <section id="tela-batalha" class="tela">
    <div class="card">
      <div class="inimigo-topo">
        <div><span class="inimigo-nome" id="inimigo-nome">—</span><span id="inimigo-tags"></span></div>
        <span class="chip" id="inimigo-level">Lv 1</span>
      </div>
      <div class="hp-linha">
        <span class="hp-rotulo pixel">HP</span>
        <div class="hp-barra"><div class="hp-preenchimento" id="inimigo-hp-barra"></div></div>
        <span class="hp-num" id="inimigo-hp-num">0/0</span>
      </div>
    </div>

    <div class="arena" id="arena"></div>

    <div class="card lider-batalha" id="lider-batalha"></div>

    <div class="log pixel" id="log"></div>

    <div class="ataques" id="ataques"></div>

    <div class="utilitarios">
      <button class="btn-principal" id="btn-capturar" onclick="tentarCaptura()">🔴 Capturar</button>
      <button class="btn-secundario" id="btn-pocao" onclick="usarPocaoBatalha()">🧪 Poção</button>
      <button class="btn-secundario" id="btn-fugir" onclick="fugir()">🏃 Fugir</button>
    </div>
  </section>

  <!-- ===================== EQUIPE ===================== -->
  <section id="tela-equipe" class="tela">
    <button class="btn-principal btn-cura" onclick="centroDeCura()">💖 Centro de Cura · curar equipe</button>
    <div class="linha-titulo">
      <h2 class="titulo-secao pixel">Sua Equipe</h2>
      <span class="chip" id="equipe-contagem">0/6</span>
    </div>
    <div class="lista" id="lista-equipe"></div>
  </section>

  <!-- ===================== BOX ===================== -->
  <section id="tela-box" class="tela">
    <div class="linha-titulo">
      <h2 class="titulo-secao pixel">Box</h2>
      <span class="chip" id="box-contagem">0</span>
    </div>
    <div class="grade-box" id="grade-box"></div>
  </section>

  <!-- ===================== LOJA ===================== -->
  <section id="tela-loja" class="tela">
    <div class="linha-titulo">
      <h2 class="titulo-secao pixel">Loja</h2>
      <span class="chip">💰 <span id="loja-dinheiro">0</span></span>
    </div>
    <div class="lista" id="lista-loja"></div>
  </section>

</main>

<!-- ===================== BARRA INFERIOR FIXA ===================== -->
<nav class="barra-inferior oculta" id="barra-inferior">
  <div class="interno">
    <button class="aba ativa" data-aba="explorar" onclick="trocarAba('explorar')"><span class="icone">🧭</span>Explorar</button>
    <button class="aba" data-aba="equipe" onclick="trocarAba('equipe')"><span class="icone">👥</span>Equipe</button>
    <button class="aba" data-aba="box" onclick="trocarAba('box')"><span class="icone">📦</span>Box</button>
    <button class="aba" data-aba="loja" onclick="trocarAba('loja')"><span class="icone">🛒</span>Loja</button>
  </div>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ======================================================================
   INICIALIZAÇÃO DO TELEGRAM
   ====================================================================== */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('bg_color'); } catch (e) {}
}

function vibrar(tipo) {
  try {
    if (!tg || !tg.HapticFeedback) return;
    if (tipo === 'leve') tg.HapticFeedback.impactOccurred('light');
    else if (tipo === 'forte') tg.HapticFeedback.impactOccurred('heavy');
    else if (tipo === 'sucesso') tg.HapticFeedback.notificationOccurred('success');
    else if (tipo === 'erro') tg.HapticFeedback.notificationOccurred('error');
  } catch (e) {}
}

// Menu em folha inferior. Resolve com o valor da opção escolhida, ou null.
function menu(titulo, opcoes, subtitulo, semCancelar) {
  return new Promise(resolve => {
    const fundo = document.createElement('div');
    fundo.className = 'menu-fundo';
    const folha = document.createElement('div');
    folha.className = 'menu-folha';
    const h = document.createElement('div');
    h.className = 'menu-titulo';
    h.textContent = titulo;
    folha.appendChild(h);
    if (subtitulo) {
      const s = document.createElement('div');
      s.className = 'menu-sub';
      s.textContent = subtitulo;
      folha.appendChild(s);
    }
    const fechar = (valor) => { fundo.remove(); resolve(valor); };
    opcoes.forEach(op => {
      const b = document.createElement('button');
      b.className = op.principal ? 'btn-principal' : 'btn-secundario';
      if (op.perigo) b.classList.add('perigo');
      b.textContent = op.texto;
      b.disabled = !!op.desativado;
      b.onclick = () => { vibrar('leve'); fechar(op.valor); };
      folha.appendChild(b);
    });
    const cancelar = document.createElement('button');
    cancelar.className = 'btn-secundario';
    cancelar.textContent = 'Cancelar';
    cancelar.onclick = () => fechar(null);
    if (!semCancelar) folha.appendChild(cancelar);
    fundo.appendChild(folha);
    fundo.onclick = (e) => { if (e.target === fundo) fechar(null); };
    document.body.appendChild(fundo);
  });
}

/* ======================================================================
   REGRAS DOS MONSTROS
   ====================================================================== */
function esp(m) { return ESPECIES[m.especie]; }
function tipoDe(m) { return esp(m).tipo; }
function multVariante(v) { return v === 'sombrio' ? 1.4 : v === 'brilhante' ? 1.25 : 1; }
function forca(m) { return esp(m).base * multVariante(m.variante); }
function hpMax(m) { return Math.round((18 + m.level * 5) * forca(m)); }
function xpProximo(m) { return m.level * 10 + 20; }

function formaPorNivel(especie, level) {
  let e = especie;
  while (ESPECIES[e].evolui && level >= ESPECIES[e].evolui[1]) e = ESPECIES[e].evolui[0];
  return e;
}

function golpesDe(m) {
  const t = tipoDe(m);
  let lista = t === 'normal' ? [] : GOLPES[t].filter(g => g.nivel <= m.level);
  lista = lista.concat(GOLPES.normal.filter(g => g.nivel <= m.level));
  lista.sort((a, b) => b.poder - a.poder);
  return lista.slice(0, 4);
}

function criarMonstro(especie, level, variante) {
  const m = { id: uid(), especie, level, xp: 0, variante: variante || '', hp: 0 };
  m.hp = hpMax(m);
  return m;
}

function sortearVariante() {
  const r = Math.random();
  if (r < CHANCE_SOMBRIO) return 'sombrio';
  if (r < CHANCE_SOMBRIO + CHANCE_BRILHANTE) return 'brilhante';
  return '';
}

function htmlTags(m) {
  let html = '';
  if (m.variante === 'brilhante') html += ' <span class="tag tag-brilhante">✨ Brilhante</span>';
  if (m.variante === 'sombrio') html += ' <span class="tag tag-sombrio">🌑 Sombrio</span>';
  return html;
}

function htmlTipo(m) {
  const t = TIPOS[tipoDe(m)];
  return `<span class="tag" style="background:${t.cor}">${t.nome}</span>`;
}

function corHP(pct) {
  if (pct > 50) return 'var(--hp-verde)';
  if (pct > 20) return 'var(--hp-amarelo)';
  return 'var(--hp-vermelho)';
}

function htmlBarraHP(m) {
  const max = hpMax(m);
  const pct = Math.max(0, Math.round(m.hp / max * 100));
  return `<div class="hp-linha"><span class="hp-rotulo pixel">HP</span>
    <div class="hp-barra"><div class="hp-preenchimento" style="width:${pct}%;background:${corHP(pct)}"></div></div>
    <span class="hp-num">${m.hp}/${max}</span></div>`;
}

function htmlBarraXP(m) {
  const pct = m.level >= NIVEL_MAX ? 100 : Math.round(m.xp / xpProximo(m) * 100);
  return `<div class="hp-linha"><span class="hp-rotulo pixel">XP</span>
    <div class="hp-barra fina"><div class="hp-preenchimento xp-preenchimento" style="width:${pct}%"></div></div></div>`;
}

function atualizarBarra(barraId, numId, m) {
  const max = hpMax(m);
  const pct = Math.max(0, Math.round(m.hp / max * 100));
  $(barraId).style.width = pct + '%';
  $(barraId).style.backgroundColor = corHP(pct);
  if (numId) $(numId).textContent = `${m.hp}/${max}`;
}

/* ======================================================================
   SPRITES (monstros originais desenhados em SVG)
   ====================================================================== */
function hexParaHsl(hex) {
  const n = parseInt(hex.slice(1), 16);
  let r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0;
  const l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > .5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [h, s * 100, l * 100];
}
const hsl = (h, s, l) => `hsl(${Math.round(((h % 360) + 360) % 360)},${Math.round(s)}%,${Math.round(l)}%)`;

function paleta(m) {
  const [h, s, l] = hexParaHsl(esp(m).cor);
  if (m.variante === 'brilhante') {
    return { corpo: hsl(h + 150, Math.min(90, s + 10), Math.min(72, l + 6)), sombra: hsl(h + 150, s, l - 14), olho: '#1d1b18', brilho: true };
  }
  if (m.variante === 'sombrio') {
    return { corpo: hsl(h, s * .35, 28), sombra: hsl(h, s * .3, 18), olho: '#c78bff', brilho: false };
  }
  return { corpo: hsl(h, s, l), sombra: hsl(h, s, l - 16), olho: '#1d1b18', brilho: false };
}

/* ======================================================================
   SALVAR E CARREGAR (Telegram CloudStorage + reserva no aparelho)
   ====================================================================== */
const CHAVE_LOCAL = 'monstros_de_bolso_v1';
const TAM_PEDACO = 3800;

function nuvemDisponivel() {
  try { return !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')); }
  catch (e) { return false; }
}

function compactar(m) { return [m.especie, m.level, m.xp, m.hp, m.variante === 'sombrio' ? 's' : m.variante === 'brilhante' ? 'b' : '']; }
function expandir(a) {
  if (!Array.isArray(a) || !ESPECIES[a[0]]) return null;
  const m = { id: uid(), especie: a[0], level: Math.min(NIVEL_MAX, Math.max(1, a[1] | 0)), xp: a[2] | 0, hp: 0,
    variante: a[4] === 's' ? 'sombrio' : a[4] === 'b' ? 'brilhante' : '' };
  m.hp = Math.min(hpMax(m), Math.max(0, a[3] | 0));
  return m;
}

function serializar() {
  return JSON.stringify({
    v: 1,
    x: estado.treinador.xp,
    d: estado.treinador.dinheiro,
    i: estado.itens,
    e: estado.equipe.map(compactar),
    b: estado.box.map(compactar)
  });
}

function desserializar(texto) {
  try {
    const s = JSON.parse(texto);
    if (!s || !Array.isArray(s.e)) return false;
    const equipe = s.e.map(expandir).filter(Boolean);
    if (equipe.length === 0) return false;
    estado.iniciado = true;
    estado.treinador.xp = s.x | 0;
    estado.treinador.dinheiro = Math.max(0, s.d | 0);
    estado.itens = Object.assign({ esfera: 0, superEsfera: 0, pocao: 0, superPocao: 0 }, s.i || {});
    estado.equipe = equipe.slice(0, 6);
    estado.box = (s.b || []).map(expandir).filter(Boolean).concat(equipe.slice(6));
    return true;
  } catch (e) {
    return false;
  }
}

let salvarTimer;
function salvar() {
  clearTimeout(salvarTimer);
  salvarTimer = setTimeout(gravar, 400);
}

function gravar() {
  if (!estado.iniciado) return;
  const texto = serializar();
  try { localStorage.setItem(CHAVE_LOCAL, texto); } catch (e) {}
  if (!nuvemDisponivel()) return;
  try {
    const pedacos = [];
    for (let i = 0; i < texto.length; i += TAM_PEDACO) pedacos.push(texto.slice(i, i + TAM_PEDACO));
    pedacos.forEach((p, i) => tg.CloudStorage.setItem('s' + i, p));
    tg.CloudStorage.setItem('n', String(pedacos.length));
  } catch (e) {}
}

function lerLocal() {
  try { return localStorage.getItem(CHAVE_LOCAL); } catch (e) { return null; }
}

function lerNuvem() {
  return new Promise(resolve => {
    if (!nuvemDisponivel()) return resolve(null);
    const limite = setTimeout(() => resolve(null), 3000);
    try {
      tg.CloudStorage.getItem('n', (err, n) => {
        const qtd = parseInt(n, 10);
        if (err || !qtd) { clearTimeout(limite); return resolve(null); }
        const chaves = Array.from({ length: qtd }, (_, i) => 's' + i);
        tg.CloudStorage.getItems(chaves, (err2, valores) => {
          clearTimeout(limite);
          if (err2 || !valores) return resolve(null);
          resolve(chaves.map(k => valores[k] || '').join(''));
        });
      });
    } catch (e) {
      clearTimeout(limite);
      resolve(null);
    }
  });
}

let abaAtual = 'explorar';

function mostrarTela(id) {
  document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
  $('tela-' + id).classList.add('ativa');
  window.scrollTo(0, 0);
}

function trocarAba(aba) {
  if (estado.batalha && aba !== 'explorar') {
    aviso('Termine a batalha primeiro!');
    vibrar('erro');
    return;
  }
  vibrar('leve');
  abaAtual = aba;
  document.querySelectorAll('.aba').forEach(b => b.classList.toggle('ativa', b.dataset.aba === aba));

  if (aba === 'explorar') {
    if (estado.batalha) { mostrarTela('batalha'); return; }
    renderExplorar();
    mostrarTela('explorar');
  } else if (aba === 'equipe') {

    mostrarTela('equipe');
  } else if (aba === 'box') {

    mostrarTela('box');
  } else if (aba === 'loja') {

  }
}

let buscando = false;

async function procurarMonstro(rota, botao) {
  if (buscando || estado.batalha) return;
  const lider = estado.equipe[0];
  if (lider.hp <= 0) {
    aviso(`${esp(lider).nome} está sem energia! Cure no Centro de Cura (aba Equipe).`, 2600);
    vibrar('erro');
    return;
  }
  buscando = true;
  vibrar('leve');
  botao.classList.add('buscando');
  await esperar(650);
  botao.classList.remove('buscando');
  buscando = false;

  const dados = ROTAS[rota];
  const base = (dados.raros.length && Math.random() < 0.08) ? escolher(dados.raros) : escolher(dados.comuns);
  const nivel = Math.min(NIVEL_MAX, Math.max(dados.minimo, lider.level + aleatorio(-3, 1)));
  const inimigo = criarMonstro(formaPorNivel(base, nivel), nivel, sortearVariante());
  iniciarBatalha(inimigo, dados.cor);
}

function iniciarBatalha(inimigo, corArena) {

  else if (inimigo.variante === 'sombrio') { log(`🌑 Um ${esp(inimigo).nome} SOMBRIO apareceu!`); vibrar('sucesso'); }
  else log(`Um ${esp(inimigo).nome} selvagem apareceu!`);

function renderLiderBatalha() {

  box.innerHTML = `${sprite(l)}<div class="info"><span class="nome"></span>${htmlBarraHP(l)}</div>`;

}

function renderAtaques() {

  const grid = $('ataques');
  grid.innerHTML = '';
  golpesDe(lider).forEach(g => {
    const b = document.createElement('button');

    b.innerHTML = `<span class="ataque-nome"></span><span class="ataque-info">${TIPOS[g.tipo].nome} · Poder ${g.poder}</span>`;
    b.querySelector('.ataque-nome').textContent = g.nome;
    b.onclick = () => usarAtaque(g);
    grid.appendChild(b);
  });
}

function log(texto) {
  const p = document.createElement('p');
  p.textContent = texto;
  const caixa = $('log');
  caixa.appendChild(p);
  while (caixa.children.length > 8) caixa.removeChild(caixa.firstChild);
  caixa.scrollTop = caixa.scrollHeight;
}

function travarAcoes(travar) {
  if (estado.batalha) estado.batalha.travado = travar;
  document.querySelectorAll('#ataques button, #btn-capturar, #btn-pocao, #btn-fugir').forEach(b => b.disabled = travar);
}

function multiplicadorTipo(golpe, defensor) {
  const td = tipoDe(defensor);
  if ((VANTAGENS[golpe.tipo] || []).includes(td)) return 2;
  if ((VANTAGENS[td] || []).includes(golpe.tipo)) return 0.5;
  return 1;
}

function calcularDano(atacante, defensor, golpe) {
  const mult = multiplicadorTipo(golpe, defensor);
  const mesmoTipo = golpe.tipo === tipoDe(atacante) ? 1.2 : 1;
  const base = golpe.poder * (0.4 + atacante.level / 9);
  const relacao = Math.sqrt(forca(atacante) / forca(defensor)) * Math.sqrt((atacante.level + 8) / (defensor.level + 8));
  const variacao = 0.85 + Math.random() * 0.15;
  return { dano: Math.max(1, Math.round(base * relacao * mult * mesmoTipo * variacao)), mult };
}

function animarDano() {
  const arena = $('arena');
  arena.classList.remove('dano');
  void arena.offsetWidth;
  arena.classList.add('dano');
}

async function usarAtaque(golpe) {
  const b = estado.batalha;
  if (!b || b.travado) return;
  travarAcoes(true);
  vibrar('leve');

  const lider = estado.equipe[0];
  log(`${esp(lider).nome} usou ${golpe.nome}!`);
  await esperar(500);

  if (Math.random() > golpe.precisao) {
    log('Mas errou!');
  } else {
    const { dano, mult } = calcularDano(lider, b.inimigo, golpe);
    b.inimigo.hp = Math.max(0, b.inimigo.hp - dano);
    animarDano();
    atualizarBarra('inimigo-hp-barra', 'inimigo-hp-num', b.inimigo);
    if (mult > 1) log('É super eficaz!');
    if (mult < 1) log('Não foi muito eficaz...');
  }
  await esperar(600);

  if (b.inimigo.hp <= 0) return vitoria();
  await turnoInimigo();
}

async function turnoInimigo() {
  const b = estado.batalha;
  const lider = estado.equipe[0];
  const golpe = escolher(golpesDe(b.inimigo));
  log(`${esp(b.inimigo).nome} usou ${golpe.nome}!`);
  await esperar(500);

  if (Math.random() > golpe.precisao) {
    log('Mas errou!');
  } else {
    const { dano, mult } = calcularDano(b.inimigo, lider, golpe);
    lider.hp = Math.max(0, lider.hp - dano);
    vibrar('forte');
    log(`${esp(lider).nome} perdeu ${dano} de HP${mult > 1 ? ' (super eficaz!)' : ''}.`);
    renderLiderBatalha();
  }
  await esperar(500);

  if (lider.hp <= 0) {
    log(`${esp(lider).nome} desmaiou!`);
    vibrar('erro');
    await esperar(900);
    const proximo = estado.equipe.findIndex(m => m.hp > 0);
    if (proximo > 0) {
      const [m] = estado.equipe.splice(proximo, 1);
      estado.equipe.unshift(m);
      log(`Vai, ${esp(m).nome}!`);
      renderLiderBatalha();
      renderAtaques();
    } else {
      return derrota();
    }
  }
  travarAcoes(false);
}

async function vitoria() {
  const b = estado.batalha;
  const inimigo = b.inimigo;
  const bonus = inimigo.variante === 'sombrio' ? 2 : inimigo.variante === 'brilhante' ? 1.5 : 1;
  const premio = Math.round(inimigo.level * 15 * bonus);
  const xp = Math.round(inimigo.level * 8 * esp(inimigo).base * bonus);

  log(`${esp(inimigo).nome} foi derrotado!`);
  log(`Você ganhou 💰 ${fmt(premio)} e ${fmt(xp)} XP.`);
  vibrar('sucesso');
  estado.treinador.dinheiro += premio;
  const nivelAntes = nivelTreinador();
  estado.treinador.xp += xp;
  if (nivelTreinador() > nivelAntes) aviso(`⭐ Você subiu para o Level ${nivelTreinador()}!`);

  await esperar(700);
  await distribuirXP(xp);
  await esperar(900);
  encerrarBatalha();
  await verificarEvolucoes();
}

// O líder recebe todo o XP; o resto da equipe recebe 30%
async function distribuirXP(xp) {
  for (let i = 0; i < estado.equipe.length; i++) {
    const m = estado.equipe[i];
    if (m.hp <= 0 && i !== 0) continue;
    const ganho = i === 0 ? xp : Math.round(xp * 0.3);
    const subiu = ganharXP(m, ganho);
    if (subiu > 0 && i === 0) {
      log(`${esp(m).nome} subiu para o Lv ${m.level}!`);
      vibrar('sucesso');
      await esperar(500);
    }
  }
}

function ganharXP(m, xp) {
  if (m.level >= NIVEL_MAX) return 0;
  const hpAntes = hpMax(m);
  let subiu = 0;
  m.xp += xp;
  while (m.level < NIVEL_MAX && m.xp >= xpProximo(m)) {
    m.xp -= xpProximo(m);
    m.level++;
    subiu++;
  }
  if (m.level >= NIVEL_MAX) m.xp = 0;
  if (m.hp > 0) m.hp = Math.min(hpMax(m), m.hp + (hpMax(m) - hpAntes));
  return subiu;
}

async function verificarEvolucoes() {
  for (const m of estado.equipe) {
    const evo = esp(m).evolui;
    if (!evo || m.level < evo[1]) continue;
    const nomeAntes = esp(m).nome;
    const hpAntes = hpMax(m);
    m.especie = formaPorNivel(m.especie, m.level);
    m.hp = Math.max(m.hp > 0 ? 1 : 0, m.hp + (hpMax(m) - hpAntes));
    vibrar('sucesso');
    await menu(`✨ ${nomeAntes} evoluiu para ${esp(m).nome}!`, [{ texto: 'Incrível!', valor: true, principal: true }], `Agora no Lv ${m.level}, mais forte e com novos golpes.`, true);
  }
  salvar();
  renderExplorar();
}

async function derrota() {
  const perda = Math.floor(estado.treinador.dinheiro * 0.1);
  estado.treinador.dinheiro -= perda;
  estado.equipe.forEach(m => m.hp = hpMax(m));
  log('Toda a sua equipe desmaiou...');
  vibrar('erro');
  await esperar(1400);
  aviso(`Você correu para o Centro de Cura e perdeu 💰 ${fmt(perda)}.`, 3000);
  encerrarBatalha();
}

async function tentarCaptura() {
  const b = estado.batalha;
  if (!b || b.travado) return;
  const it = estado.itens;
  if (it.esfera + it.superEsfera <= 0) {
    aviso('Sem esferas! Compre na Loja.');
    vibrar('erro');
    return;
  }

  let tipoEsfera = 'esfera';
  if (it.superEsfera > 0) {
    const escolha = await menu('Qual esfera usar?', [
      { texto: `🔴 Esfera (${it.esfera})`, valor: 'esfera', desativado: it.esfera <= 0 },
      { texto: `🔵 Super Esfera (${it.superEsfera})`, valor: 'superEsfera', principal: true }
    ]);
    if (!escolha) return;
    tipoEsfera = escolha;
  } else if (it.esfera <= 0) {
    return;
  }

  travarAcoes(true);
  it[tipoEsfera]--;
  vibrar('leve');

  const arena = $('arena');
  log(`Você lançou a ${ITENS[tipoEsfera].nome}!`);
  arena.className = 'arena capturando';
  await esperar(900);

  const pctVida = b.inimigo.hp / hpMax(b.inimigo);
  let chance = 0.2 + (1 - pctVida) * 0.6;
  if (b.inimigo.variante) chance *= 0.6;
  if (tipoEsfera === 'superEsfera') chance *= 1.6;
  chance = Math.min(0.95, chance);

  if (Math.random() < chance) {
    const capturado = b.inimigo;
    let destino;
    if (estado.equipe.length < 6) { estado.equipe.push(capturado); destino = 'para sua equipe'; }
    else { estado.box.push(capturado); destino = 'para a Box'; }
    log(`Pegou! ${esp(capturado).nome} foi ${destino}.`);
    vibrar('sucesso');
    await esperar(1500);
    encerrarBatalha();
  } else {
    arena.className = 'arena escapou' + (b.inimigo.variante ? ' raro' : '');
    log(`${esp(b.inimigo).nome} escapou!`);
    vibrar('erro');
    await esperar(600);
    await turnoInimigo();
  }
}

async function usarPocaoBatalha() {
  const b = estado.batalha;
  if (!b || b.travado) return;
  const it = estado.itens;
  const lider = estado.equipe[0];
  if (it.pocao + it.superPocao <= 0) { aviso('Sem poções! Compre na Loja.'); vibrar('erro'); return; }
  if (lider.hp >= hpMax(lider)) { aviso(`${esp(lider).nome} já está com o HP cheio.`); return; }

  const escolha = await menu(`Curar ${esp(lider).nome}`, [
    { texto: `🧪 Poção (${it.pocao}) · +40%`, valor: 'pocao', desativado: it.pocao <= 0 },
    { texto: `💖 Super Poção (${it.superPocao}) · HP cheio`, valor: 'superPocao', desativado: it.superPocao <= 0 }
  ], `HP ${lider.hp}/${hpMax(lider)}`);
  if (!escolha) return;

  travarAcoes(true);
  it[escolha]--;
  const max = hpMax(lider);
  const antes = lider.hp;
  lider.hp = escolha === 'superPocao' ? max : Math.min(max, lider.hp + Math.round(max * 0.4));
  log(`${esp(lider).nome} recuperou ${lider.hp - antes} de HP.`);
  vibrar('sucesso');
  renderLiderBatalha();
  await esperar(700);
  await turnoInimigo();
}

function fugir() {
  const b = estado.batalha;
  if (!b || b.travado) return;
  vibrar('leve');
  aviso('Você fugiu em segurança!');
  encerrarBatalha();
}

function encerrarBatalha() {
  estado.batalha = null;
  salvar();
  renderExplorar();
  mostrarTela('explorar');
}

/* ======================================================================
   INÍCIO
   ====================================================================== */
(async function iniciar() {
  const usuario = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (usuario && usuario.first_name) estado.treinador.nome = usuario.first_name;

  const salvoNuvem = await lerNuvem();
  const carregou = (salvoNuvem && desserializar(salvoNuvem)) || (lerLocal() && desserializar(lerLocal()));

  if (carregou) {
    abrirJogo();
  } else {
    renderInicio();
    mostrarTela('inicio');
  }
})();
</script>
